[workspace]
resolver = "2"
members = [
    "crates/atomic-recall-core",
    "crates/atomic-recall-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
atomic-recall-core = { path = "crates/atomic-recall-core" }
atomic-core = { path = "../atomic/atomic-core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
reqwest = { version = "0.12", features = ["json"] }
walkdir = "2"
async-trait = "0.1"
indicatif = "0.17"
